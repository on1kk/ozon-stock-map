<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Остатки FBO Ozon · Карта складов</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1322; --panel:#141c30; --panel-2:#1a2440; --line:#243154;
    --text:#e9eef8; --muted:#8b98b8; --accent:#4d8dff; --hot:#ff2d6c;
    --warn:#ffb020; --ok:#37d99a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7b5cff);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff}
  h1{font-size:14px;font-weight:600}
  h1 span{color:var(--muted);font-weight:400}
  .updated{margin-left:auto;font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
  .updated b{color:var(--ok);font-weight:500}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .kpi{background:var(--panel);padding:8px 18px}
  .kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .kpi .v{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;margin-top:1px}
  .kpi .v small{font-size:11px;color:var(--muted);font-weight:400}

  .controls{display:flex;gap:10px;align-items:center;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .controls label{font-size:12px;color:var(--muted)}
  select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;max-width:340px}
  .hint{font-size:11px;color:var(--muted);margin-left:auto}

  main{flex:1;display:flex;min-height:0;position:relative}
  #map{flex:1;background:#0a0f1c}
  aside{width:360px;min-width:300px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .aside-head{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .aside-head .title{font-size:13px;font-weight:600;flex:1}
  .aside-head .sub{font-size:11px;color:var(--muted)}
  .back{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
  .back:hover{background:var(--line)}
  .list{flex:1;overflow-y:auto}

  .row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid rgba(36,49,84,.5);cursor:pointer;transition:background .15s}
  .row:hover,.row.active{background:var(--panel-2)}
  .rank{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right}
  .row .name{font-size:12.5px;font-weight:500}
  .row .sub{font-size:11px;color:var(--muted);margin-top:1px}
  .row .val{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;text-align:right}
  .row .qty{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);text-align:right;margin-top:1px}
  .bar{grid-column:2/4;height:3px;border-radius:2px;background:var(--panel-2);overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7b5cff);border-radius:2px}
  .bar i.over{background:linear-gradient(90deg,var(--warn),var(--hot))}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .tag.over{background:rgba(255,176,32,.15);color:var(--warn)}
  .tag.nocost{background:rgba(255,45,108,.15);color:var(--hot)}
  .tag.transit{background:rgba(77,141,255,.15);color:var(--accent)}

  .warnbox{position:absolute;left:12px;bottom:12px;z-index:900;background:rgba(20,28,48,.94);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:11px;color:var(--muted);max-width:290px;display:none}
  .warnbox b{color:var(--warn)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:950;background:rgba(13,19,34,.85);font-size:13px;color:var(--muted);text-align:center;padding:20px}

  .pp{min-width:200px;font-size:12px;font-family:"IBM Plex Sans",sans-serif}
  .pp b{font-size:13px;display:block;margin-bottom:5px}
  .pp table{width:100%;border-collapse:collapse}
  .pp td{padding:2px 0;color:#5a6788}
  .pp td:last-child{text-align:right;color:#111;font-family:"IBM Plex Mono",monospace;font-weight:500}

  @media(max-width:820px){
    main{flex-direction:column}
    aside{width:100%;max-height:42vh;border-left:none;border-top:1px solid var(--line)}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .hint{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="logo">FBO</div>
  <h1>Остатки по складам Ozon <span>· сток по себестоимости</span></h1>
  <div class="updated">обновлено: <b id="updated">—</b></div>
</header>

<div class="kpis">
  <div class="kpi"><div class="l">Сток на складах</div><div class="v" id="kStock">—</div></div>
  <div class="kpi"><div class="l">В пути</div><div class="v" id="kTransit">—</div></div>
  <div class="kpi"><div class="l">Единиц товара</div><div class="v" id="kQty">—</div></div>
  <div class="kpi"><div class="l">Складов</div><div class="v" id="kWh">—</div></div>
</div>

<div class="controls">
  <label>Товар:</label>
  <select id="skuFilter"><option value="">Все товары</option></select>
  <label>Сортировка:</label>
  <select id="sort">
    <option value="value">по стоимости</option>
    <option value="qty">по количеству</option>
  </select>
  <span class="hint">Клик по складу — состав товаров на нём. Оранжевым — затоваренные (запас &gt; 30 дней)</span>
</div>

<main>
  <div id="map">
    <div class="overlay" id="overlay">Загрузка данных…</div>
    <div class="warnbox" id="warnbox"></div>
  </div>
  <aside>
    <div class="aside-head" id="asideHead">
      <div><div class="title" id="asideTitle">Склады</div><div class="sub" id="asideSub"></div></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<script>
/* ===== Ключ Яндекс.Карт ===== */
const YANDEX_API_KEY = "b18a75c9-ff35-440e-b401-a68c261f3a97";

const fmt  = n => Math.round(n).toLocaleString("ru-RU");
const fmtR = n => n >= 1e6 ? (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2}) + " млн ₽"
                           : Math.round(n/1e3).toLocaleString("ru-RU") + " тыс ₽";

let DATA = null;          // содержимое stocks.json
let map = null;
let circles = [];
let selectedOffer = "";
let view = "warehouses";

const listEl  = document.getElementById("list");
const titleEl = document.getElementById("asideTitle");
const subEl   = document.getElementById("asideSub");
const headEl  = document.getElementById("asideHead");
const sortSel = document.getElementById("sort");
const skuSel  = document.getElementById("skuFilter");
const overlay = document.getElementById("overlay");
const warnbox = document.getElementById("warnbox");

/* ===== Загрузка данных ===== */
fetch("data/stocks.json?nocache=" + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; onData(); })
  .catch(() => {
    overlay.innerHTML = "Данных пока нет.<br>Запустите workflow «Обновление остатков» во вкладке Actions репозитория — файл data/stocks.json появится через минуту.";
  });

/* ===== Яндекс.Карты ===== */
const ys = document.createElement("script");
ys.src = "https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=" + YANDEX_API_KEY;
ys.onload = () => ymaps.ready(() => {
  map = new ymaps.Map("map", {center:[57.5,63], zoom:4, controls:["zoomControl"]},
                      {suppressMapOpenBlock:true});
  if (DATA) drawCircles();
});
document.head.appendChild(ys);

function onData(){
  overlay.style.display = "none";

  /* KPI */
  const ws = DATA.warehouses;
  const stock   = ws.reduce((s,w)=>s+w.stock_value,0);
  const transit = ws.reduce((s,w)=>s+w.transit_value,0);
  const qty     = ws.reduce((s,w)=>s+w.qty,0);
  document.getElementById("kStock").textContent   = fmtR(stock);
  document.getElementById("kTransit").textContent = fmtR(transit);
  document.getElementById("kQty").innerHTML       = fmt(qty)+" <small>шт</small>";
  document.getElementById("kWh").textContent      = ws.filter(w=>w.lat).length;
  document.getElementById("updated").textContent  =
    new Date(DATA.updated_at).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

  /* Дропдаун товаров */
  const products = new Map();
  ws.forEach(w => w.items.forEach(i => {
    if(!products.has(i.offer_id))
      products.set(i.offer_id, {offer_id:i.offer_id, name:i.name, value:0});
    products.get(i.offer_id).value += i.value;
  }));
  [...products.values()].sort((a,b)=>b.value-a.value).forEach(p=>{
    const o = document.createElement("option");
    o.value = p.offer_id;
    o.textContent = `${p.name} (${p.offer_id})`;
    skuSel.appendChild(o);
  });

  /* Предупреждения */
  const msgs = [];
  if (DATA.unknown_warehouses?.length)
    msgs.push(`<b>Нераспознанные склады (${DATA.unknown_warehouses.length}):</b> ${DATA.unknown_warehouses.join(", ")} — добавьте их в warehouses.py`);
  if (DATA.offers_without_cost?.length)
    msgs.push(`<b>Без себестоимости (${DATA.offers_without_cost.length} арт.):</b> ${DATA.offers_without_cost.slice(0,8).join(", ")}${DATA.offers_without_cost.length>8?"…":""} — они не входят в денежный итог`);
  if (msgs.length){ warnbox.innerHTML = msgs.join("<br><br>"); warnbox.style.display = "block"; }

  if (map) drawCircles();
  renderWarehouses();
}

function itemOf(w){ return w.items.find(i=>i.offer_id===selectedOffer); }
function whValue(w){ return selectedOffer ? (itemOf(w)?.value ?? 0) : w.stock_value; }
function whQty(w){ return selectedOffer ? (itemOf(w)?.qty ?? 0) : w.qty; }

function drawCircles(){
  circles.forEach(c=>map.geoObjects.remove(c));
  circles = [];
  const ws = DATA.warehouses.filter(w=>w.lat && whQty(w)>0);
  const vals = ws.map(w=>Math.max(whValue(w), 1));
  if(!vals.length) return;
  const maxV = Math.max(...vals);
  ws.forEach(w=>{
    const v = Math.max(whValue(w),1);
    const hasOver = selectedOffer ? (itemOf(w)?.over) : w.items.some(i=>i.over);
    const r = 25000 + 95000*Math.sqrt(v/maxV);
    const c = new ymaps.Circle([[w.lat,w.lon], r], {balloonContent: balloonHtml(w)}, {
      fillColor: hasOver ? "#ffb02040" : "#4d8dff40",
      strokeColor: hasOver ? "#ffb020" : "#4d8dff",
      strokeWidth: 1.5,
    });
    c.events.add("click", ()=>openDetail(w));
    map.geoObjects.add(c);
    circles.push(c);
  });
}

function balloonHtml(w){
  const it = itemOf(w);
  return `<div class="pp"><b>${w.name}</b>
    <table>
      <tr><td>Кластер</td><td>${w.cluster}</td></tr>
      <tr><td>${selectedOffer?"Сток товара":"Сток"}</td><td>${fmtR(whValue(w))}</td></tr>
      <tr><td>Количество</td><td>${fmt(whQty(w))} шт</td></tr>
      ${selectedOffer && it ? `<tr><td>Запас</td><td>${it.days===null?"нет продаж":it.days+" дн"}</td></tr>` : ""}
      ${!selectedOffer && w.transit_qty ? `<tr><td>В пути</td><td>${fmt(w.transit_qty)} шт · ${fmtR(w.transit_value)}</td></tr>` : ""}
    </table></div>`;
}

function renderWarehouses(){
  view = "warehouses";
  headEl.querySelector(".back")?.remove();
  titleEl.textContent = selectedOffer ? "Где лежит товар" : "Склады";
  subEl.textContent = selectedOffer
    ? (skuSel.selectedOptions[0]?.textContent || "")
    : "клик — состав товаров на складе";

  const key = sortSel.value;
  const arr = DATA.warehouses
    .map(w=>({w, v:whValue(w), q:whQty(w)}))
    .filter(x=>x.q>0)
    .sort((a,b)=> key==="qty" ? b.q-a.q : b.v-a.v);
  const maxV = arr.length ? Math.max(...arr.map(x=>Math.max(x.v,1))) : 1;

  listEl.innerHTML = arr.map((x,i)=>{
    const overN = x.w.items.filter(it=>it.over).length;
    const nocost = x.w.items.some(it=>it.nocost);
    return `
    <div class="row" data-wh="${x.w.name}">
      <div class="rank">${String(i+1).padStart(2,"0")}</div>
      <div><div class="name">${x.w.name}
          ${overN?`<span class="tag over">затовар ×${overN}</span>`:""}
          ${nocost?'<span class="tag nocost">нет с/с</span>':""}
          ${x.w.transit_qty?'<span class="tag transit">в пути</span>':""}
          ${!x.w.lat?'<span class="tag nocost">нет на карте</span>':""}</div>
        <div class="sub">${x.w.cluster}</div></div>
      <div><div class="val">${fmtR(x.v)}</div><div class="qty">${fmt(x.q)} шт</div></div>
      <div class="bar"><i style="width:${(100*Math.max(x.v,1)/maxV).toFixed(1)}%"></i></div>
    </div>`;}).join("");

  listEl.querySelectorAll(".row").forEach(r=>{
    r.addEventListener("click",()=>{
      const w = DATA.warehouses.find(w=>w.name===r.dataset.wh);
      if(map && w.lat) map.setCenter([w.lat,w.lon], 6, {duration:400});
      openDetail(w);
    });
  });
}

function openDetail(w){
  view = "detail";
  titleEl.textContent = w.name;
  subEl.textContent = `${w.cluster} · ${fmtR(w.stock_value)} · ${fmt(w.qty)} шт`;
  if(!headEl.querySelector(".back")){
    const b = document.createElement("button");
    b.className = "back"; b.textContent = "← Все склады";
    b.addEventListener("click", renderWarehouses);
    headEl.prepend(b);
  }
  const items = [...w.items].sort((a,b)=>b.value-a.value);
  const maxV = Math.max(...items.map(i=>Math.max(i.value,1)), 1);
  listEl.innerHTML = items.map((it,i)=>`
    <div class="row" style="cursor:default">
      <div class="rank">${String(i+1).padStart(2,"0")}</div>
      <div><div class="name">${it.name}
          ${it.over?'<span class="tag over">затовар</span>':""}
          ${it.nocost?'<span class="tag nocost">нет с/с</span>':""}</div>
        <div class="sub">${it.offer_id}${it.cost!=null?` · с/с ${fmt(it.cost)} ₽`:""} · запас: ${it.days===null?"нет продаж 30 дн":it.days+" дн"}${it.transit?` · в пути ${fmt(it.transit)} шт`:""}</div></div>
      <div><div class="val">${it.nocost?"—":fmtR(it.value)}</div><div class="qty">${fmt(it.qty)} шт</div></div>
      <div class="bar"><i class="${it.over?'over':''}" style="width:${(100*Math.max(it.value,1)/maxV).toFixed(1)}%"></i></div>
    </div>`).join("");
}

skuSel.addEventListener("change", e=>{
  selectedOffer = e.target.value;
  if(DATA){ if(map) drawCircles(); renderWarehouses(); }
});
sortSel.addEventListener("change", ()=>{ if(DATA && view==="warehouses") renderWarehouses(); });
</script>
</body>
</html>
