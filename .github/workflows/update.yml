name: Обновление остатков

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:        # кнопка ручного запуска

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сбор данных из Ozon
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_API_KEY: ${{ secrets.WB_API_KEY }}
          MOYSKLAD_TOKEN: ${{ secrets.MOYSKLAD_TOKEN }}
        run: python fetch_data.py

      - name: Публикация data/stocks.json
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@github.com"
          git add data/stocks.json
          git diff --cached --quiet && echo "Изменений нет" && exit 0
          git commit -m "Обновление остатков $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
